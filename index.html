    function readJson(key, fallback = null) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch(e) { return fallback; }
    }
    function writeJson(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch(e) {}

    function getCookie(name) {
      try {
        const prefix = encodeURIComponent(name) + "=";
        const hit = document.cookie.split("; ").find(x => x.startsWith(prefix));
        return hit ? decodeURIComponent(hit.slice(prefix.length)) : "";
      } catch(e) { return ""; }
    }
    function setCookie(name, value, days = TRUST_DEVICE_DAYS) {

      } catch(e) {}
    }

      setCookie(DEVICE_TOKEN_COOKIE, token, TRUST_DEVICE_DAYS);
      if (user) {
        writeJson(USER_PROFILE_CACHE_KEY, user);
        if (user.phone) { try { localStorage.setItem(LAST_PHONE_KEY, user.phone); } catch(e) {} }
      }
    }
    function clearUserSession() {
      try { localStorage.removeItem(USER_TOKEN_KEY); } catch(e) {}
      try { localStorage.removeItem(USER_PROFILE_CACHE_KEY); } catch(e) {}
      clearCookie(DEVICE_TOKEN_COOKIE);
    }
    function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

    async function api(action, payload = {}) {
      const res = await fetch(DEFAULT_API_URL, {
        method: "POST",
        redirect: "follow",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action, ...payload })
      });
      const json = await res.json();
      if (json.status === "error") throw new Error(json.message || "系統錯誤");
      return json;
    }

    // 只給「讀取型」API 使用，避免短暫網路不穩就把使用者踢回登入畫面。
    async function apiWithRetry(action, payload = {}, retries = 2) {
      let lastError;
      for (let i = 0; i <= retries; i++) {
        try { return await api(action, payload); }
        catch(e) {
          lastError = e;
          if (i < retries) await sleep(450 * (i + 1));
        }
      }
      throw lastError;
    }

    function isSessionInvalidError(message) {
      const s = String(message || "");
      return s.includes("登入已失效") || s.includes("登入已過期") || s.includes("權限不足");
    }

    const money = (n) => `NT$ ${Number(n || 0).toLocaleString("zh-TW")}`;
    const today = () => {
      const d = new Date();
      const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,"0"), day = String(d.getDate()).padStart(2,"0");
      return `${y}-${m}-${day}`;
    };
    const statusMap = {
      WAITING_PAYMENT: ["等待您匯款／回報", "bg-orange-100 text-orange-700"],
      PAYMENT_REPORTED: ["已回報・待執秘確認", "bg-amber-100 text-amber-700"],
      PAYMENT_ISSUE: ["資料需確認", "bg-rose-100 text-rose-700"],
      PAID: ["已確認・票券已成立", "bg-emerald-100 text-emerald-700"],
      CANCELLED: ["已取消", "bg-slate-100 text-slate-400"]
    };

    function BrandFooter() {

        <div className="text-[13px] sm:text-[11px] font-black tracking-[.24em] text-slate-400">日安匕禾</div>
        <div className="text-[11px] sm:text-[9px] uppercase tracking-[.16em] text-slate-300 mt-1">Beaver Tech System</div>
        <div className="text-[10px] sm:text-[8px] font-mono text-slate-200 mt-1">BUILD {APP_VERSION}</div>

          </div>

        <main className="max-w-3xl mx-auto px-3 sm:px-4 py-4 sm:py-5 safe-bottom w-full flex-1">{children}</main>
        <BrandFooter />

    function Loading({text="資料載入中..."}) {
      return <div className="fixed inset-0 z-50 bg-black/45 backdrop-blur-sm flex items-center justify-center p-5">
        <div className="bg-white rounded-[2rem] p-7 shadow-2xl w-full max-w-xs text-center">
          <div className="flex justify-center gap-2 mb-5"><div className="loading-dot"/><div className="loading-dot"/><div className="loading-dot"/></div>
          <div className="font-black text-slate-800 text-lg">{text}</div>

    function Notice({type="info", children}) {
      const cls = type === "error" ? "bg-rose-50 text-rose-700 border-rose-200" : type === "success" ? "bg-emerald-50 text-emerald-700 border-emerald-200" : type === "warn" ? "bg-amber-50 text-amber-800 border-amber-200" : "bg-indigo-50 text-indigo-700 border-indigo-200";
      return <div className={`border rounded-[1.35rem] p-4 sm:p-4 text-[15px] sm:text-sm font-bold leading-7 ${cls}`}>{children}</div>;
    }

    function ticketShareText(ticket) {
      const hello = ticket.recipientName ? `${ticket.recipientName}您好，\n` : "";
      return `${hello}這是您的「臺中惠民扶輪社 扶輪日入場券」。\n${ticket.name}\n活動當日請開啟以下連結出示 QR Code：\n${ticket.url || ticket.ticketUrl}`;
    }

    async function shareTicket(ticket) {
      const url = ticket.url || ticket.ticketUrl;
      if (ticket.isCheckedIn || ticket.checkInTime) {
        alert("此票券已完成報到，不能再轉送。");
        return;
      }
      const text = ticketShareText(ticket);
      try {
        if (navigator.share) {
          await navigator.share({ title: "扶輪日入場券", text: `臺中惠民扶輪社 扶輪日入場券｜${ticket.name}`, url });
          return;
        }
      } catch (e) {
        if (e && e.name === "AbortError") return;
      }
      window.open(`https://line.me/R/msg/text/?${encodeURIComponent(text)}`, "_blank");
    }

    async function copyTicketLink(ticket) {
      const url = ticket.url || ticket.ticketUrl;
      if (ticket.isCheckedIn || ticket.checkInTime) {
        alert("此票券已完成報到，不能再轉送。");
        return;
      }
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(url);
        } else {
          const ta = document.createElement("textarea");
          ta.value = url; ta.style.position = "fixed"; ta.style.opacity = "0";
          document.body.appendChild(ta); ta.focus(); ta.select(); document.execCommand("copy"); ta.remove();
        }
        alert("✅ 票券連結已複製，可以貼到 LINE 傳給朋友。");
      } catch(e) {
        window.prompt("請長按並複製以下票券連結：", url);
      }
    }

    function TicketPublic({ticketId, token, config}) {
      const [data, setData] = useState(null);
      const [error, setError] = useState("");
      useEffect(() => { apiWithRetry("get_ticket_public", { ticketId, token }, 1).then(r => setData(r.data)).catch(e => setError(e.message)); }, [ticketId, token]);
      if (error) return <Shell config={config}><Notice type="error">{error}</Notice></Shell>;
      if (!data) return <Loading text="正在開啟入場券..." />;
      const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=${encodeURIComponent(data.ticketUrl)}`;
      return <Shell config={{...config, eventName:data.eventName}}>
        <div className="bg-white rounded-[2rem] ticket-shadow overflow-hidden border border-violet-100">

            <img src={ROTARY_WHEEL_DATA_URL} alt="Rotary" className="w-16 h-16 mx-auto mb-3 drop-shadow" />
            <div className="text-xs tracking-[.25em] text-white/70 uppercase">Rotary Club of Taichung Huimin · Rotary Day</div>
            <h2 className="text-3xl font-black mt-2">{data.ticketTitle}</h2>
          </div>
          <div className="p-7 text-center">
            <div className="text-2xl font-black text-slate-900">{data.name}</div>
            {data.recipientName&&<div className="mt-2 inline-flex items-center px-4 py-2 rounded-full bg-amber-50 text-amber-700 font-black text-sm">🎁 受贈人：{data.recipientName}</div>}
            <div className="mt-2 text-xs font-mono text-slate-400">{data.ticketId}</div>
            <div className="mt-6 bg-white border-2 border-violet-100 rounded-[1.75rem] p-4 max-w-[350px] mx-auto shadow-sm">
              <img src={qrUrl} className="w-full aspect-square rounded-xl" alt="入場 QR Code" />
            </div>
            <div className="mt-5 text-base font-black text-[#5B3F8C]">活動當日請出示此 QR Code 入場</div>
            <div className="mt-1 text-sm text-slate-500">接待人員掃描確認後即可完成報到；每張票只能成功使用一次。</div>
            {(data.eventDate || data.eventTime || data.eventLocation) && <div className="mt-6 bg-slate-50 rounded-2xl p-4 text-sm text-left space-y-1">
              {data.eventDate && <div><b>日期：</b>{data.eventDate} {data.eventTime}</div>}
              {data.eventLocation && <div><b>地點：</b>{data.eventLocation}</div>}
            </div>}
            {!data.isCheckedIn ? <div className="mt-5 grid grid-cols-1 sm:grid-cols-2 gap-3">
              <button onClick={()=>shareTicket({name:data.name,ticketUrl:data.ticketUrl,isCheckedIn:data.isCheckedIn})} className="py-4 rounded-2xl bg-[#06C755] text-white font-black text-lg shadow">轉送票券</button>
              <button onClick={()=>copyTicketLink({name:data.name,ticketUrl:data.ticketUrl,isCheckedIn:data.isCheckedIn})} className="py-4 rounded-2xl bg-violet-50 border border-violet-200 text-[#5B3F8C] font-black text-lg">複製票券連結</button>
            </div> : <div className="mt-5 bg-emerald-50 text-emerald-700 rounded-xl p-3 font-black">✓ 已完成入場報到，此票券已使用，無法再轉送</div>}
          </div>
        </div>
      </Shell>;

    function Auth({config, onAuthed}) {
      const [mode, setMode] = useState("login");
      const [step, setStep] = useState("form"); // form | magic | otp
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState("");
      const [masked, setMasked] = useState("");
      const [phoneStatus, setPhoneStatus] = useState(null); // null | checking | registered | new | error
      const [form, setForm] = useState({
        phone:(()=>{try{return localStorage.getItem(LAST_PHONE_KEY)||""}catch(e){return ""}})(),
        name:"", title:"先生", email:"", code:""
      });
      const set = (k,v) => setForm(f=>({...f,[k]:v}));
      const phoneValid = /^09\d{8}$/.test(form.phone);

      const setPhone = (v) => {
        const cleaned = String(v || "").replace(/\D/g,"").slice(0,10);
        set("phone", cleaned);
        setPhoneStatus(null);
        setError("");
      };

      // 手機輸入滿 10 碼後，自動查後端是否已註冊。
      useEffect(() => {
        if (!phoneValid || step !== "form") {
          setPhoneStatus(null);
          return;
        }
        let cancelled = false;
        const timer = setTimeout(async () => {
          setPhoneStatus("checking");
          try {
            const r = await apiWithRetry("check_phone", {phone: form.phone}, 1);
            if (cancelled) return;
            setPhoneStatus(r.registered ? "registered" : "new");
            if (r.registered && mode === "register") setMode("login");
          } catch(e) {
            if (!cancelled) setPhoneStatus("error");
          }
        }, 350);
        return () => { cancelled = true; clearTimeout(timer); };
      }, [form.phone, phoneValid, step, mode]);

      async function sendMagicLink() {
        setError("");
        if (!phoneValid) {
          setError("手機號碼必須填滿 10 碼數字，並以 09 開頭，例如：0912345678");
          return;
        }
        if (mode === "login" && phoneStatus === "new") {
          setMode("register");
          setError("這支手機尚未建立帳號，請填寫姓名與 Email 建立帳號。");
          return;
        }
        if (mode === "register" && phoneStatus === "registered") {
          setMode("login");
          setError("這支手機已經註冊過，不需要重新建立帳號。");
          return;
        }

        setLoading(true);
        try {
          let r;
          if (mode === "register") {
            const returnOrderId=new URLSearchParams(location.search).get("order")||"";
            r = await api("start_register", {phone:form.phone,name:form.name,title:form.title,email:form.email,returnOrderId});
            if (r.status === "exists") {
              setPhoneStatus("registered");
              setMode("login");
              throw new Error("這支手機已經註冊過，請使用手機登入。");
            }
          } else {
            const returnOrderId=new URLSearchParams(location.search).get("order")||"";
            r = await api("start_login", {phone:form.phone,returnOrderId});
            if (r.status === "not_found") {
              setPhoneStatus("new");
              setMode("register");
              throw new Error("這支手機尚未建立帳號，請先建立帳號。");
            }
          }
          setMasked(r.maskedEmail || "");
          setStep("magic");
        } catch(e) {
          setError(e.message);
        } finally {
          setLoading(false);
        }
      }

      async function verifyOtp() {
        setError("");
        if (!/^\d{6}$/.test(form.code)) {
          setError("請輸入 Email 裡的 6 位數備用驗證碼");
          return;
        }
        setLoading(true);
        try {
          const action = mode === "register" ? "verify_register" : "verify_login";
          const r = await api(action, {phone:form.phone,code:form.code});
          persistUserSession(r.sessionToken, r.user);
          onAuthed(r.user, r.sessionToken);
        } catch(e) {
          setError(e.message);
        } finally {
          setLoading(false);
        }
      }

      async function recheckMagicLogin() {
        setError("");
        const t = getStoredUserToken();
        if (!t) {
          setError("目前尚未完成驗證。請先到 Email 點選「點我登入扶輪日售票系統」。");
          return;
        }
        setLoading(true);
        try {
          const r = await apiWithRetry("session_me", {sessionToken:t}, 1);
          persistUserSession(t, r.user);
          onAuthed(r.user, t);
        } catch(e) {
          setError("尚未完成登入，請回到 Email 點選紫色登入按鈕。");
        } finally {
          setLoading(false);
        }
      }

      const loginReady = phoneValid && phoneStatus !== "new";
      const registerReady = phoneValid && phoneStatus !== "registered";

      return <Shell config={config}>
        {loading && <Loading text={step === "otp" ? "正在驗證備用驗證碼..." : step === "magic" ? "正在確認登入狀態..." : "正在寄送一鍵登入連結..."} />}

              onClick={()=>{setMode("login");setStep("form");setError("")}}

            >手機登入</button>
            <button
              onClick={()=>{setMode("register");setStep("form");setError("")}}
              className={`flex-1 py-4 rounded-[1.1rem] text-lg sm:text-base font-black ${mode==="register"?"bg-white shadow text-[#5B3F8C]":"text-slate-400"}`}

            {config.loginPageNotice}

            <div className="mb-4">

              </Notice>
            </div>

          {step === "form" && <div className="space-y-5">
            <div>
              <label className="text-base sm:text-sm font-bold text-slate-700">手機號碼</label>
              <input
                value={form.phone}
                onChange={e=>setPhone(e.target.value)}
                inputMode="numeric"
                autoComplete="tel"
                maxLength={10}
                placeholder="例如：0912345678"
                className={`mt-1 w-full px-5 py-5 rounded-3xl border-2 outline-none focus:ring-4 text-[2rem] sm:text-2xl font-black tracking-wide ${
                  form.phone && !phoneValid ? "border-red-300 focus:ring-red-100" :
                  phoneStatus === "registered" ? "border-emerald-300 focus:ring-emerald-100" :
                  phoneStatus === "new" ? "border-amber-300 focus:ring-amber-100" :
                  "border-violet-200 focus:ring-violet-100"
                }`}
              />
              <div className="mt-3 flex items-center justify-between gap-3 text-base sm:text-sm">
                <span className={form.phone && !phoneValid ? "text-red-500 font-bold" : "text-slate-400"}>
                  請輸入 09 開頭的 10 碼手機號碼
                </span>
                <span className={`shrink-0 font-mono font-black ${phoneValid ? "text-emerald-600" : "text-slate-400"}`}>{form.phone.length}/10</span>
              </div>

              {form.phone.length === 10 && !phoneValid &&
                <div className="mt-2 text-base font-black text-red-500">手機號碼格式不正確，必須是 09 開頭共 10 碼。</div>
              }
              {phoneValid && phoneStatus === "checking" &&
                <div className="mt-3 rounded-2xl bg-slate-50 px-4 py-3 text-base font-bold text-slate-500">⏳ 正在查詢這支手機是否已註冊…</div>
              }
              {phoneValid && phoneStatus === "registered" &&
                <div className="mt-3 rounded-2xl bg-emerald-50 border border-emerald-200 px-4 py-4 text-base font-black text-emerald-700">✅ 此手機號碼已註冊</div>
              }
              {phoneValid && phoneStatus === "new" &&
                <div className="mt-3 rounded-2xl bg-amber-50 border border-amber-200 px-4 py-4 text-base font-black text-amber-700">尚未找到此手機帳號，請使用「第一次建立帳號」。</div>
              }
            </div>

            {mode === "register" && <>
              <div><label className="text-base sm:text-sm font-bold text-slate-700">姓名</label><input value={form.name} onChange={e=>set("name",e.target.value)} className="mt-1 w-full px-4 py-4 rounded-2xl border-2 border-slate-200 text-lg" /></div>
              <div><label className="text-base sm:text-sm font-bold text-slate-700">稱謂</label><div className="grid grid-cols-2 gap-3 mt-2">{["先生","小姐"].map(t=><button type="button" key={t} onClick={()=>set("title",t)} className={`py-4 rounded-2xl border-2 text-lg font-black ${form.title===t?"bg-violet-50 border-violet-300 text-[#5B3F8C]":"border-slate-200 text-slate-500"}`}>{t}</button>)}</div></div>
              <div><label className="text-base sm:text-sm font-bold text-slate-700">Email</label><input value={form.email} onChange={e=>set("email",e.target.value)} inputMode="email" autoComplete="email" placeholder="收據與入場券將寄到這裡" className="mt-1 w-full px-4 py-4 rounded-2xl border-2 border-slate-200 text-lg" /></div>
            </>}

            {mode === "login" && phoneStatus === "new" &&
              <button type="button" onClick={()=>{setMode("register");setError("")}} className="w-full py-4 rounded-2xl bg-amber-500 text-white font-black text-lg">前往第一次建立帳號</button>
            }

            <button
              disabled={loading || (mode==="login" ? !loginReady : !registerReady)}
              onClick={sendMagicLink}
              className={`w-full py-5 rounded-3xl text-white font-black text-xl shadow-lg transition ${
                !loading && (mode==="login" ? loginReady : registerReady)
                  ? "bg-[#5B3F8C] active:scale-[.99]"
                  : "bg-slate-300 cursor-not-allowed shadow-none"
              }`}
            >
              {mode==="register" ? "建立帳號並寄送一鍵登入連結" : "寄送一鍵登入連結"}
            </button>

            <div className="text-center text-sm leading-6 text-slate-400">
              Email 收到後只要點一下紫色登入按鈕，就會直接回到本系統。
            </div>
          </div>}

          {step === "magic" && <div className="text-center py-2">

            <div className="mt-6 rounded-[2rem] bg-amber-50 border-2 border-amber-200 px-5 py-6">
              <div className="text-[2rem] sm:text-3xl font-black text-slate-900 leading-tight">請前往您的 Email</div>
              <div className="text-xl sm:text-lg font-black text-amber-700 mt-3 leading-8">不要在這個畫面按登入</div>
              <div className="text-base text-slate-600 mt-3 leading-7">登入信已寄到<br/><b className="text-slate-900">{masked}</b></div>

            <div className="mt-5 text-left bg-white rounded-[1.6rem] border-2 border-violet-100 p-5 shadow-sm">
              <div className="text-sm font-black text-[#5B3F8C] tracking-wider mb-4">請照下面 3 個步驟操作</div>

                <div className="flex gap-4 items-start">
                  <div className="shrink-0 w-10 h-10 rounded-full bg-[#5B3F8C] text-white flex items-center justify-center font-black text-xl">1</div>
                  <div><div className="font-black text-lg">打開您的 Email 信箱</div><div className="text-sm text-slate-500 mt-1">例如 Gmail、Apple Mail 或其他信箱 App</div></div>

                <div className="flex gap-4 items-start">
                  <div className="shrink-0 w-10 h-10 rounded-full bg-[#5B3F8C] text-white flex items-center justify-center font-black text-xl">2</div>
                  <div><div className="font-black text-lg">找到「扶輪日一鍵登入」信件</div><div className="text-sm text-slate-500 mt-1">如果沒有看到，可以稍等幾秒再重新整理信箱</div></div>
                </div>
                <div className="flex gap-4 items-start">
                  <div className="shrink-0 w-10 h-10 rounded-full bg-[#5B3F8C] text-white flex items-center justify-center font-black text-xl">3</div>
                  <div><div className="font-black text-lg">點信件裡的「點我登入」</div><div className="text-sm text-slate-500 mt-1">系統就會自動帶您回來並完成登入，不需要輸入數字</div></div>
                </div>
              </div>

              <div className="text-2xl font-black">使用備用驗證碼</div>

            <button onClick={()=>{setStep("magic");setError("")}} className="w-full mt-3 py-3 text-slate-400 font-bold text-base">返回一鍵登入說明</button>

    function PaymentModal({order, config, onClose, onDone}) {
      const [form,setForm]=useState({transferDate:today(), amount:String(order.totalAmount||""), last5:order.prefillLast5 || order.payment?.last5 || ""});
      const [loading,setLoading]=useState(false); const [error,setError]=useState("");
      const token=getStoredUserToken();
      async function submit(){
        setLoading(true);setError("");
        try{
          const r=await api("report_payment",{sessionToken:token,orderId:order.orderId,transferDate:form.transferDate,amount:form.amount,last5:form.last5});
          if(r.warning) alert(r.warning); onDone(); onClose();
        }catch(e){setError(e.message)}finally{setLoading(false)}
      }
      return <div className="fixed inset-0 z-40 bg-black/55 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
        {loading&&<Loading text="正在通知執秘..."/>}
        <div className="bg-white w-full max-w-md rounded-t-[2rem] sm:rounded-[2rem] p-5 sm:p-6 max-h-[92vh] overflow-y-auto">
          <div className="flex justify-between items-center"><h3 className="text-2xl sm:text-xl font-black">回報已匯款</h3><button onClick={onClose} className="w-10 h-10 rounded-full bg-slate-100 font-black">×</button></div>
          <div className="mt-4 bg-violet-50 rounded-2xl p-4 text-[15px] sm:text-sm leading-7">
            <div><b>銀行：</b>{config.bankName || "尚未設定"} {config.bankBranch || ""}</div>
            {config.bankCode&&<div><b>銀行代碼：</b>{config.bankCode}</div>}
            <div><b>戶名：</b>{config.bankAccountName || "尚未設定"}</div>
            <div><b>帳號：</b>{config.bankAccount || "尚未設定"}</div>
            <div><b>本訂單應付：</b>{money(order.totalAmount)}</div>
          </div>
          <div className="mt-4"><Notice>這一步只會通知執秘核帳，<b>不會產生 QR Code</b>。只有執秘確認實際收到款項後，才會寄送收據與入場券。</Notice></div>
          {error&&<div className="mt-4"><Notice type="error">{error}</Notice></div>}
          <div className="space-y-5 mt-5">
            <div><label className="text-sm font-bold text-slate-600">匯款日期</label><input type="date" value={form.transferDate} onChange={e=>setForm({...form,transferDate:e.target.value})} className="w-full mt-1 p-4 rounded-2xl border-2"/></div>
            <div><label className="text-sm font-bold text-slate-600">實際匯款金額</label><input inputMode="numeric" value={form.amount} onChange={e=>setForm({...form,amount:e.target.value.replace(/[^0-9]/g,"")})} className="w-full mt-1 p-4 rounded-2xl border-2 text-xl font-black"/></div>
            <div><label className="text-sm font-bold text-slate-600">匯款帳號後五碼</label><input inputMode="numeric" maxLength="5" value={form.last5} onChange={e=>setForm({...form,last5:e.target.value.replace(/\D/g,"").slice(0,5)})} placeholder="例如 12345" className="w-full mt-1 p-4 rounded-2xl border-2 text-2xl font-black tracking-widest"/></div>
            <button onClick={submit} className="w-full py-5 bg-amber-500 text-white rounded-3xl font-black text-xl sm:text-lg shadow-lg">✅ 我已完成匯款，通知執秘</button>
          </div>
        </div>
      </div>;
    }

    function BuyerDashboard({config,user,onLogout,focusOrderId}) {
      const ordersCacheKey = ORDERS_CACHE_PREFIX + user.userId;
      const [orders,setOrders]=useState(()=>readJson(ordersCacheKey, [])); const [qty,setQty]=useState(1);
      const defaultReceiptTitle=`${user.name}${user.title}`;
      const [customReceipt,setCustomReceipt]=useState(false);
      const [receiptTitle,setReceiptTitle]=useState(defaultReceiptTitle);
      const [identity,setIdentity]=useState(""); const [club,setClub]=useState(""); const [last5,setLast5]=useState("");
      const [paymentOrder,setPaymentOrder]=useState(null); const [createdOrder,setCreatedOrder]=useState(null); const [loading,setLoading]=useState(false); const [error,setError]=useState("");
      const token=getStoredUserToken();
      const total=qty*Number(config.ticketPrice||0);
      async function refresh(){
        setError("");
        try{
          const r=await apiWithRetry("list_my_orders",{sessionToken:token},1);
          const next=r.data||[];
          setOrders(next); writeJson(ordersCacheKey,next);
        }catch(e){setError("目前連線較慢，已保留上次資料。請稍後按「更新」即可。")}
      }
      useEffect(()=>{refresh()},[]);
      useEffect(()=>{
        if(!focusOrderId || !orders.length) return;
        const target=orders.find(o=>o.orderId===focusOrderId);
        if(!target) return;
        const timer=setTimeout(()=>{
          const el=document.getElementById(`order-${focusOrderId}`);
          if(el){el.scrollIntoView({behavior:"smooth",block:"start"});}
        },350);
        return ()=>clearTimeout(timer);
      },[focusOrderId,orders.length]);
      function focusField(id){
        setTimeout(()=>{
          const el=document.getElementById(id);
          if(el){el.scrollIntoView({behavior:"smooth",block:"center"});setTimeout(()=>el.focus(),250);}
        },80);
      }
      async function createOrder(){
        setError("");
        if(!identity){
          alert("請先選擇購票身分，才能建立訂單。");
          return;
        }
        if(identity==="扶輪社友／寶眷"&&!club.trim()){
          alert("請填寫所屬扶輪社\n\n您選擇的是「扶輪社友／寶眷」，請先填寫您的扶輪社社名，否則訂單無法送出。");
          focusField("clubInput");
          return;
        }
        const finalReceiptTitle=customReceipt?receiptTitle.trim():defaultReceiptTitle;
        if(customReceipt&&!finalReceiptTitle){
          alert("請填寫電子收據繳款人名稱\n\n您已選擇使用其他繳款人名稱，請先輸入姓名或收據抬頭，才能建立訂單。");
          focusField("receiptTitleInput");
          return;
        }
        setLoading(true);
        try{
          const r=await api("create_order",{sessionToken:token,quantity:qty,receiptTitle:finalReceiptTitle,identity,club:club.trim(),last5});
          await refresh(); setQty(1); setCustomReceipt(false); setReceiptTitle(defaultReceiptTitle);
          setCreatedOrder(r.order||{orderId:"",totalAmount:total});
          if(r.warning) setError(r.warning);
        }catch(e){setError(e.message)}finally{setLoading(false)}
      }
      async function deleteOrder(o){
        if(!window.confirm(`確定要刪除這筆尚未匯款的訂單嗎？

訂單：${o.orderId}
金額：${money(o.totalAmount)}

⚠️ 如果您已經完成轉帳，請按「取消」，不要刪除訂單，請改按「我已匯款」。

刪除後無法復原。`)) return;
        setLoading(true); setError("");
        try{
          const r=await api("delete_order",{sessionToken:token,orderId:o.orderId});
          alert("✅ "+r.message);
          await refresh();
        }catch(e){alert("無法刪除訂單："+e.message);setError(e.message)}finally{setLoading(false)}
      }
      async function saveRecipient(ticket, options={shareAfter:false,copyAfter:false}){
        if(ticket.checkInTime){ alert("此票券已完成報到，不能再修改受贈人。"); return; }
        const current=ticket.recipientName||"";
        const label=(options.shareAfter||options.copyAfter)&&!current?"這張票要送給誰？\n\n請輸入受贈人姓名：":"請輸入這張票的受贈人姓名：";
        const input=window.prompt(label,current);
        if(input===null) return;
        const name=input.trim();
        if(!name){
          if(!current){ alert("請先輸入受贈人姓名，才能記錄這張票送給誰。"); return; }
          if(!window.confirm("要清除目前的受贈人紀錄嗎？")) return;
        }
        setLoading(true); setError("");
        try{
          await api("set_ticket_recipient",{sessionToken:token,ticketId:ticket.ticketId,recipientName:name});
          const updated={...ticket,recipientName:name};
          await refresh();
          if(options.shareAfter && name) await shareTicket(updated);
          if(options.copyAfter && name) await copyTicketLink(updated);
        }catch(e){alert(e.message);setError(e.message)}finally{setLoading(false)}
      }
      async function shareManagedTicket(ticket){
        if(ticket.checkInTime){ alert("此票券已完成報到，不能再轉送。"); return; }
        if(!ticket.recipientName){
          await saveRecipient(ticket,{shareAfter:true});
          return;
        }
        await shareTicket(ticket);
      }
      async function copyManagedTicket(ticket){
        if(ticket.checkInTime){ alert("此票券已完成報到，不能再轉送。"); return; }
        if(!ticket.recipientName){
          await saveRecipient(ticket,{copyAfter:true});
          return;
        }
        await copyTicketLink(ticket);
      }
      return <Shell config={config}>
        {loading&&<Loading text="正在建立訂單..."/>}
        {paymentOrder&&<PaymentModal order={paymentOrder} config={config} onClose={()=>setPaymentOrder(null)} onDone={refresh}/>} 
        {createdOrder&&<div className="fixed inset-0 z-50 bg-black/55 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-[2rem] shadow-2xl w-full max-w-lg p-6 sm:p-7">
            <div className="text-center">
              <div className="text-4xl">✅</div>
              <h2 className="mt-2 text-2xl font-black text-[#5B3F8C]">訂單已建立</h2>
              <div className="mt-1 text-sm text-slate-400">但目前還沒有完成購票程序</div>
            </div>
            <div className="mt-5 rounded-2xl border-2 border-orange-200 bg-orange-50 p-5">
              <div className="text-xl font-black text-orange-700">匯款完成 ≠ 購票完成</div>
              <div className="mt-3 space-y-3 text-base leading-7 text-slate-700">
                <div><b>①</b> 依訂單下方的銀行資料完成匯款</div>
                <div><b>②</b> 匯款完成後，請務必回到本頁按下：</div>
                <div className="rounded-xl bg-amber-500 text-white text-center font-black py-3 px-3">✅ 我已完成匯款，通知執秘</div>
              </div>
              <div className="mt-4 text-sm font-bold leading-6 text-orange-700">未按付款回報按鈕，執秘不會知道您已匯款，也不會產生電子收據與 QR Code 入場券。</div>
            </div>
            <button onClick={()=>{setCreatedOrder(null);setTimeout(()=>document.getElementById(`order-${createdOrder.orderId}`)?.scrollIntoView({behavior:"smooth",block:"center"}),80)}} className="w-full mt-5 py-4 rounded-2xl bg-[#5B3F8C] text-white font-black text-lg">我知道了，查看匯款資料</button>
          </div>
        </div>}
        <div className="flex justify-between items-center mb-5"><div><div className="text-sm text-slate-400">歡迎回來</div><div className="font-black text-2xl sm:text-lg">{user.name}{user.title}</div></div><button onClick={onLogout} className="px-4 py-3 rounded-2xl border bg-white text-base sm:text-sm font-bold text-slate-500">登出</button></div>
        {error&&<div className="mb-4"><Notice type="error">{error}</Notice></div>}
        {orders.some(o=>o.status==="WAITING_PAYMENT")&&<div className="mb-4 rounded-[1.6rem] border-2 border-orange-200 bg-orange-50 p-5">
          <div className="text-lg font-black text-orange-700">⚠️ 您有 {orders.filter(o=>o.status==="WAITING_PAYMENT").length} 筆訂單尚未完成付款回報</div>
          <div className="mt-2 text-sm leading-6 text-orange-700">如果您已經匯款，請記得在該筆訂單下方按「我已完成匯款，通知執秘」。完成這一步後，執秘才能核帳並寄出電子收據與 QR Code 入場券。</div>
        </div>}
        {(config.eventDate||config.eventTime||config.eventLocation) && <div className="mb-4 bg-white rounded-[1.5rem] p-5 border text-[15px] sm:text-sm leading-7 soft-card"><b>活動資訊</b><br/>{config.eventDate} {config.eventTime}<br/>{config.eventLocation}</div>}
        {(config.eventIntroTitle||config.eventIntro) && <div className="mb-4 bg-white rounded-[1.7rem] p-5 sm:p-6 border border-violet-100 soft-card shadow-sm">
          {config.eventIntroTitle&&<h2 className="text-2xl sm:text-xl font-black text-[#5B3F8C] leading-snug">{config.eventIntroTitle}</h2>}
          {config.eventIntro&&<div className="mt-3 text-[15px] sm:text-sm leading-8 text-slate-700 whitespace-pre-wrap">{config.eventIntro}</div>}
        </div>}
        {!config.salesOpen && <div className="mb-4"><Notice type="warn">目前暫停開放新的購票訂單；既有訂單仍可查詢。</Notice></div>}

        <section className="bg-white rounded-[2rem] border border-violet-100 p-5 sm:p-6 soft-card shadow-sm">
          <div className="font-black text-[#5B3F8C] text-xl sm:text-base">購買扶輪日票券</div>
          <div className="mt-1 text-sm sm:text-xs text-slate-400">每張 {money(config.ticketPrice)}</div>
          <div className="mt-5"><label className="text-sm sm:text-xs font-bold text-slate-600">身分</label><div className="grid grid-cols-3 gap-2 mt-2">{["扶輪社友／寶眷","貴賓","其他"].map(v=><button type="button" key={v} onClick={()=>setIdentity(v)} className={`py-4 rounded-2xl border text-sm sm:text-xs font-black ${identity===v?"bg-violet-50 border-violet-300 text-[#5B3F8C]":"border-slate-200 text-slate-500"}`}>{v}</button>)}</div></div>
          {identity==="扶輪社友／寶眷"&&<div className="mt-4"><label className="text-sm sm:text-xs font-bold text-slate-600">所屬扶輪社 <span className="text-rose-500">＊必填</span></label><input id="clubInput" value={club} onChange={e=>setClub(e.target.value)} placeholder="例如：臺中惠民扶輪社" className="w-full mt-1 p-4 rounded-2xl border-2 border-slate-200 focus:border-violet-400 outline-none"/><div className="mt-1 text-xs text-rose-500">選擇「扶輪社友／寶眷」時，必須填寫扶輪社社名。</div></div>}
          <div className="flex items-center justify-between mt-5 bg-slate-50 rounded-[1.6rem] p-4">
            <button onClick={()=>setQty(q=>Math.max(1,q-1))} className="w-16 h-16 rounded-2xl bg-white shadow font-black text-3xl">−</button>

          <div className="mt-4 bg-emerald-50 border border-emerald-100 rounded-2xl p-4">

            <label className="mt-4 flex items-center gap-3 bg-white/80 border border-emerald-200 rounded-2xl p-3 cursor-pointer">
              <input type="checkbox" checked={customReceipt} onChange={e=>{const checked=e.target.checked;setCustomReceipt(checked);setReceiptTitle(checked?"":defaultReceiptTitle);}} className="w-5 h-5 accent-emerald-600"/>
              <span className="font-black text-emerald-800">填寫其他收據繳款人名稱</span>
            </label>
            {customReceipt&&<div className="mt-3"><label className="text-sm font-bold text-emerald-800">收據繳款人名稱 <span className="text-rose-500">＊必填</span></label><input id="receiptTitleInput" value={receiptTitle} onChange={e=>setReceiptTitle(e.target.value)} maxLength="80" placeholder="例如：王小明先生／○○公司" className="w-full mt-1 p-4 rounded-2xl border-2 border-emerald-200 bg-white focus:border-emerald-500 outline-none text-lg font-bold"/><div className="text-xs text-emerald-600 mt-1">這個名稱只會使用在電子收據，不會改變您的帳號姓名。</div></div>}
          </div>
          <div className="mt-4"><label className="text-sm sm:text-xs font-bold text-slate-600">匯款帳號後五碼 <span className="text-slate-300">（可先填，尚未匯款可留白）</span></label><input inputMode="numeric" maxLength="5" value={last5} onChange={e=>setLast5(e.target.value.replace(/\D/g,"").slice(0,5))} placeholder="完成轉帳後可直接填寫" className="w-full mt-1 p-4 rounded-2xl border-2 border-slate-200 tracking-[.28em] font-bold text-lg"/></div>
          <div className="flex justify-between items-end mt-6 bg-violet-50 rounded-[1.5rem] p-4"><div className="text-base sm:text-sm text-slate-500">應付總額</div><div className="text-3xl sm:text-2xl font-black text-[#5B3F8C]">{money(total)}</div></div>
          <button onClick={createOrder} disabled={!config.ticketPrice||!config.salesOpen} className="w-full mt-5 py-5 rounded-3xl bg-[#5B3F8C] disabled:bg-slate-300 text-white font-black text-xl sm:text-lg shadow-lg">建立購票訂單</button>

                  <div className="mt-3 flex items-center gap-2 text-xs font-bold text-slate-500"><span className="text-emerald-600">✓ 建立訂單</span><span>→</span><span className="text-orange-600">② 完成匯款</span><span>→</span><span className="text-orange-600">③ 回來通知執秘</span><span>→</span><span>④ 等待出票</span></div>
                </div>
                <div className="bg-violet-50 rounded-2xl p-4 text-sm leading-7"><div><b>銀行：</b>{config.bankName || "尚未設定"} {config.bankBranch||""}</div>{config.bankCode&&<div><b>銀行代碼：</b>{config.bankCode}</div>}<div><b>戶名：</b>{config.bankAccountName || "尚未設定"}</div><div><b>帳號：</b>{config.bankAccount || "尚未設定"}</div></div>

                {(()=>{const ts=o.tickets||[];const used=ts.filter(t=>!!t.checkInTime).length;const assigned=ts.filter(t=>!!t.recipientName).length;const unassigned=ts.filter(t=>!t.recipientName&&!t.checkInTime).length;return <div className="mb-3 bg-amber-50 border border-amber-100 rounded-2xl p-3 text-sm font-bold text-amber-800">🎁 票券分配：共 {ts.length} 張｜已指定 {assigned} 張｜尚未分配 {unassigned} 張｜已報到 {used} 張</div>})()}
                <div className="grid gap-3">{(o.tickets||[]).map(t=><div key={t.ticketId} className="p-4 rounded-2xl bg-violet-50 border border-violet-100">

                  <div className={`mt-3 rounded-xl px-3 py-2 text-sm font-bold ${t.recipientName?"bg-white text-amber-700":"bg-white/70 text-slate-400"}`}>{t.recipientName?`🎁 已指定給：${t.recipientName}`:"這張票還沒有指定受贈人"}</div>

      async function verifyToken(t=token){if(!t)return false;try{await apiWithRetry("admin_session",{adminToken:t},1);return true}catch(e){if(isSessionInvalidError(e.message)){localStorage.removeItem(ADMIN_TOKEN_KEY);setToken("");}return false}}

      async function markIssue(o){const note=window.prompt("請輸入需要對方確認的原因，例如：應收 4,400 元，但目前只查到 2,200 元。", "匯款資料需要進一步確認");if(note===null)return;setLoading(true);setError("");try{await api("admin_mark_payment_issue",{adminToken:token,orderId:o.orderId,note});alert("已標記為資料需確認並通知購買人");await load(token)}catch(e){setError(e.message)}finally{setLoading(false)}}
      async function resend(o){if(!window.confirm(`重新寄送 ${o.orderId} 的收據與全部票券？`))return;setLoading(true);try{const r=await api("admin_resend_order_email",{adminToken:token,orderId:o.orderId});alert("✅ "+r.message)}catch(e){setError(e.message)}finally{setLoading(false)}}
      function logout(){localStorage.removeItem(ADMIN_TOKEN_KEY);setToken("");setPassword("")}

              <div className="mt-3 text-xs text-slate-400">{o.phone} · {o.email}</div>

          {tab==="orders"&&<div><div className="flex justify-between items-center mb-4"><div><h2 className="text-2xl font-black">全部訂單</h2><p className="text-xs text-slate-400">顯示最近 300 筆</p></div><button onClick={()=>loadOrders(token)} className="px-4 py-3 bg-white rounded-2xl border text-base sm:text-xs font-bold">更新</button></div><div className="space-y-3">{orders.map(o=>{const sm=statusMap[o.status]||[o.status,"bg-slate-100"];return <div key={o.orderId} className="bg-white rounded-[1.4rem] p-4 border soft-card"><div className="flex justify-between gap-2"><div><div className="font-black">{o.buyerName}{o.title}</div><div className="text-[10px] font-mono text-slate-400">{o.orderId}</div><div className="text-sm sm:text-xs text-slate-400 mt-1">{o.quantity} 張 · {money(o.totalAmount)} · {o.identity}{o.club?` · ${o.club}`:""}</div></div><span className={`h-fit text-xs font-black px-3 py-1.5 rounded-full ${sm[1]}`}>{sm[0]}</span></div>{o.note&&<div className="text-xs text-rose-600 mt-2">{o.note}</div>}{o.status==="PAID"&&<div className="mt-3 flex flex-wrap gap-2">{o.receiptDriveUrl&&<a href={o.receiptDriveUrl} target="_blank" rel="noreferrer" className="px-3 py-2 rounded-xl bg-emerald-50 text-emerald-700 font-black text-xs">查看第一聯雲端存根</a>}<button onClick={()=>resend(o)} className="px-3 py-2 rounded-xl bg-violet-50 text-[#5B3F8C] font-black text-xs">重新寄送收據＋票券</button></div>}</div>})}</div></div>}
          {tab==="settings"&&<AdminSettings token={token} onSaved={onConfigChanged}/>}

    function App(){
      const params=new URLSearchParams(location.search);
      const ticketId=params.get("ticket");
      const ticketToken=params.get("k");
      const adminMode=params.get("admin")==="1";
      const manageMode=params.get("manage")==="1";
      const manageOrderId=params.get("order")||"";
      const magicToken=params.get("magic");

      const storedToken = getStoredUserToken();
      const cachedUser = storedToken ? readJson(USER_PROFILE_CACHE_KEY, null) : null;
      const cachedConfig = readJson(CONFIG_CACHE_KEY, null);

      const [config,setConfig]=useState(cachedConfig);
      const [user,setUser]=useState(cachedUser);
      const [checking,setChecking]=useState(!cachedUser && !ticketId && !adminMode && !magicToken);
      const [magicChecking,setMagicChecking]=useState(!!magicToken);
      const [magicError,setMagicError]=useState("");

      async function refreshConfig(){
        try{
          const r=await apiWithRetry("get_config",{},1);
          setConfig(r.data); writeJson(CONFIG_CACHE_KEY,r.data);
        }catch(e){
          if(!config) setConfig({eventName:"臺中惠民扶輪社 扶輪日",ticketTitle:"扶輪日入場券",ticketPrice:0,maxTicketsPerOrder:20,salesOpen:true,eventIntroTitle:"",eventIntro:""});
        }
      }

      useEffect(()=>{refreshConfig()},[]);
      useEffect(()=>{
        if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
      },[]);

      // Email Magic Link：點擊後直接驗證並建立一年期登入。
      useEffect(()=>{
        if(!magicToken) return;
        setMagicChecking(true);
        setMagicError("");
        api("verify_magic_link",{magicToken})
          .then(r=>{
            persistUserSession(r.sessionToken,r.user);
            setUser(r.user);
          })
          .catch(e=>setMagicError(e.message || "登入連結驗證失敗"))
          .finally(()=>{
            try {
              const q=new URLSearchParams();
              if(manageMode) q.set("manage","1");
              if(manageOrderId) q.set("order",manageOrderId);
              history.replaceState({}, "", location.pathname + (q.toString()?"?"+q.toString():""));
            } catch(e) {}
            setMagicChecking(false);
          });
      },[]);

      // 若 Magic Link 在同一瀏覽器的另一個分頁完成登入，原本頁面也自動跟上。
      useEffect(()=>{
        const handler = async (e) => {
          if (e.key !== USER_TOKEN_KEY || !e.newValue) return;
          try {
            const r = await apiWithRetry("session_me",{sessionToken:e.newValue},1);
            persistUserSession(e.newValue,r.user);
            setUser(r.user);
          } catch(ignore) {}
        };
        window.addEventListener("storage", handler);
        return ()=>window.removeEventListener("storage", handler);
      },[]);

      useEffect(()=>{
        if(ticketId||adminMode||magicToken){setChecking(false);return;}
        const t=getStoredUserToken();
        if(!t){setUser(null);setChecking(false);return;}

        apiWithRetry("session_me",{sessionToken:t},2)
          .then(r=>{
            setUser(r.user);
            persistUserSession(t, r.user);
          })
          .catch(e=>{
            if(isSessionInvalidError(e.message)){
              clearUserSession();
              setUser(null);
            }
          })
          .finally(()=>setChecking(false));
      },[]);

      if(ticketId&&ticketToken)return <TicketPublic ticketId={ticketId} token={ticketToken} config={config}/>;
      if(adminMode)return <Admin config={config} onConfigChanged={refreshConfig}/>;
      if(magicChecking || !config)return <Loading text={magicToken ? "正在完成一鍵登入..." : storedToken ? "正在辨識這台已信任裝置..." : "資料載入中..."}/>;
      if(magicError)return <Shell config={config}>
        <div className="bg-white rounded-[2rem] p-6 soft-card border">
          <Notice type="error">{magicError}</Notice>
          <a href="./" className="block w-full mt-5 py-4 rounded-2xl bg-[#5B3F8C] text-white text-center font-black text-lg">重新登入</a>
        </div>
      </Shell>;
      if(checking)return <Loading text={storedToken ? "正在辨識這台已信任裝置..." : "資料載入中..."}/>;
      if(!user)return <Auth config={config} onAuthed={(u, token)=>{
        setUser(u);
        persistUserSession(token || getStoredUserToken(), u);
      }}/>;
      return <BuyerDashboard config={config} user={user} focusOrderId={manageMode?manageOrderId:""} onLogout={()=>{
        const t=getStoredUserToken();
        api("logout",{sessionToken:t}).catch(()=>{});
        clearUserSession();
        localStorage.removeItem(ORDERS_CACHE_PREFIX + user.userId);
        setUser(null);
      }}/>;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
