<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>臺中惠民扶輪社｜扶輪日售票系統</title>
  <meta name="theme-color" content="#5B3F8C" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    html { font-size: 16px; }
    body { -webkit-tap-highlight-color: transparent; }
    .safe-bottom { padding-bottom: max(24px, env(safe-area-inset-bottom)); }
    .ticket-shadow { box-shadow: 0 18px 50px rgba(57, 35, 92, .18); }
    .loading-dot { width:10px;height:10px;border-radius:50%;background:#6d5aa4;animation:b .7s infinite alternate; }
    .loading-dot:nth-child(2){animation-delay:.15s}.loading-dot:nth-child(3){animation-delay:.3s}
    .soft-card { box-shadow: 0 6px 18px rgba(91, 63, 140, .07); }
    @keyframes b { to { transform:translateY(-8px); opacity:.45; } }
    @media (max-width: 640px) {
      html { font-size: 17px; }
      body { background: #f8f7fc; }
      input, select, textarea, button { font-size: 16px; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useEffect, useMemo, useState } = React;

    // 若您沿用既有 GAS「管理部署 → 編輯 → 新版本」，Web App 網址不會改變。
    const DEFAULT_API_URL = "https://script.google.com/macros/s/AKfycbwTBjHVnzYJW53_inuVIaMJ0JZYpChnKsHJQkAmTB9uvV8BQPBuVTcSxN67TycpDkt8/exec";
    const APP_VERSION = "v1.2.0";
    const USER_TOKEN_KEY = "huimin_rotaryday_user_token";
    const ADMIN_TOKEN_KEY = "huimin_rotaryday_admin_token";
    const USER_PROFILE_CACHE_KEY = "huimin_rotaryday_user_profile";
    const CONFIG_CACHE_KEY = "huimin_rotaryday_config";
    const ORDERS_CACHE_PREFIX = "huimin_rotaryday_orders_";
    const LAST_PHONE_KEY = "huimin_rotaryday_last_phone";
    const DEVICE_TOKEN_COOKIE = "huimin_rotaryday_device_token";
    const TRUST_DEVICE_DAYS = 365;

    function readJson(key, fallback = null) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch(e) { return fallback; }
    }
    function writeJson(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch(e) {}
    }
    function getCookie(name) {
      try {
        const prefix = encodeURIComponent(name) + "=";
        const hit = document.cookie.split("; ").find(x => x.startsWith(prefix));
        return hit ? decodeURIComponent(hit.slice(prefix.length)) : "";
      } catch(e) { return ""; }
    }
    function setCookie(name, value, days = TRUST_DEVICE_DAYS) {
      try {
        const maxAge = Math.max(1, Math.floor(days * 86400));
        document.cookie = `${encodeURIComponent(name)}=${encodeURIComponent(value)}; Max-Age=${maxAge}; Path=/; SameSite=Lax; Secure`;
      } catch(e) {}
    }
    function clearCookie(name) {
      try { document.cookie = `${encodeURIComponent(name)}=; Max-Age=0; Path=/; SameSite=Lax; Secure`; } catch(e) {}
    }
    function getStoredUserToken() {
      let token = "";
      try { token = localStorage.getItem(USER_TOKEN_KEY) || ""; } catch(e) {}
      if (token) return token;
      token = getCookie(DEVICE_TOKEN_COOKIE);
      if (token) {
        try { localStorage.setItem(USER_TOKEN_KEY, token); } catch(e) {}
      }
      return token;
    }
    function persistUserSession(token, user) {
      if (!token) return;
      try { localStorage.setItem(USER_TOKEN_KEY, token); } catch(e) {}
      setCookie(DEVICE_TOKEN_COOKIE, token, TRUST_DEVICE_DAYS);
      if (user) {
        writeJson(USER_PROFILE_CACHE_KEY, user);
        if (user.phone) { try { localStorage.setItem(LAST_PHONE_KEY, user.phone); } catch(e) {} }
      }
    }
    function clearUserSession() {
      try { localStorage.removeItem(USER_TOKEN_KEY); } catch(e) {}
      try { localStorage.removeItem(USER_PROFILE_CACHE_KEY); } catch(e) {}
      clearCookie(DEVICE_TOKEN_COOKIE);
    }
    function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

    async function api(action, payload = {}) {
      const res = await fetch(DEFAULT_API_URL, {
        method: "POST",
        redirect: "follow",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action, ...payload })
      });
      const json = await res.json();
      if (json.status === "error") throw new Error(json.message || "系統錯誤");
      return json;
    }

    // 只給「讀取型」API 使用，避免短暫網路不穩就把使用者踢回登入畫面。
    async function apiWithRetry(action, payload = {}, retries = 2) {
      let lastError;
      for (let i = 0; i <= retries; i++) {
        try { return await api(action, payload); }
        catch(e) {
          lastError = e;
          if (i < retries) await sleep(450 * (i + 1));
        }
      }
      throw lastError;
    }

    function isSessionInvalidError(message) {
      const s = String(message || "");
      return s.includes("登入已失效") || s.includes("登入已過期") || s.includes("權限不足");
    }

    const money = (n) => `NT$ ${Number(n || 0).toLocaleString("zh-TW")}`;
    const today = () => {
      const d = new Date();
      const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,"0"), day = String(d.getDate()).padStart(2,"0");
      return `${y}-${m}-${day}`;
    };
    const statusMap = {
      WAITING_PAYMENT: ["等待匯款", "bg-slate-100 text-slate-600"],
      PAYMENT_REPORTED: ["已回報・待執秘確認", "bg-amber-100 text-amber-700"],
      PAYMENT_ISSUE: ["資料需確認", "bg-rose-100 text-rose-700"],
      PAID: ["已確認・票券已成立", "bg-emerald-100 text-emerald-700"]
    };

    function BrandFooter() {
      return <footer className="text-center pb-10 pt-10 select-none">
        <div className="text-[13px] sm:text-[11px] font-black tracking-[.24em] text-slate-400">日安匕禾</div>
        <div className="text-[11px] sm:text-[9px] uppercase tracking-[.16em] text-slate-300 mt-1">Beaver Tech System</div>
        <div className="text-[10px] sm:text-[8px] font-mono text-slate-200 mt-1">BUILD {APP_VERSION}</div>
      </footer>;
    }

    function Shell({children, config}) {
      return <div className="min-h-screen bg-gradient-to-b from-violet-50 via-white to-slate-50 flex flex-col">
        <header className="bg-[#5B3F8C] text-white px-4 sm:px-5 py-5 sm:py-5 shadow-lg">
          <div className="max-w-3xl mx-auto">
            <div className="text-[12px] sm:text-[11px] tracking-[.22em] uppercase text-white/70">Rotary Club of Taichung Huimin</div>
            <h1 className="text-[2rem] sm:text-2xl font-black mt-1 leading-tight">{config?.eventName || "臺中惠民扶輪社 扶輪日"}</h1>
          </div>
        </header>
        <main className="max-w-3xl mx-auto px-3 sm:px-4 py-4 sm:py-5 safe-bottom w-full flex-1">{children}</main>
        <BrandFooter />
      </div>;
    }

    function Loading({text="資料載入中..."}) {
      return <div className="fixed inset-0 z-50 bg-black/45 backdrop-blur-sm flex items-center justify-center p-5">
        <div className="bg-white rounded-[2rem] p-7 shadow-2xl w-full max-w-xs text-center">
          <div className="flex justify-center gap-2 mb-5"><div className="loading-dot"/><div className="loading-dot"/><div className="loading-dot"/></div>
          <div className="font-black text-slate-800 text-lg">{text}</div>
          <div className="text-sm text-slate-400 mt-2 leading-6">正在安全連線，請稍候，不需要重複點擊</div>
        </div>
      </div>;
    }

    function Notice({type="info", children}) {
      const cls = type === "error" ? "bg-rose-50 text-rose-700 border-rose-200" : type === "success" ? "bg-emerald-50 text-emerald-700 border-emerald-200" : type === "warn" ? "bg-amber-50 text-amber-800 border-amber-200" : "bg-indigo-50 text-indigo-700 border-indigo-200";
      return <div className={`border rounded-[1.35rem] p-4 sm:p-4 text-[15px] sm:text-sm font-bold leading-7 ${cls}`}>{children}</div>;
    }

    function TicketPublic({ticketId, token, config}) {
      const [data, setData] = useState(null);
      const [error, setError] = useState("");
      useEffect(() => { apiWithRetry("get_ticket_public", { ticketId, token }, 1).then(r => setData(r.data)).catch(e => setError(e.message)); }, [ticketId, token]);
      if (error) return <Shell config={config}><Notice type="error">{error}</Notice></Shell>;
      if (!data) return <Loading text="正在開啟入場券..." />;
      const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=${encodeURIComponent(data.ticketUrl)}`;
      return <Shell config={{...config, eventName:data.eventName}}>
        <div className="bg-white rounded-[2rem] ticket-shadow overflow-hidden border border-violet-100">
          <div className="bg-gradient-to-br from-[#5B3F8C] to-[#7964A9] text-white text-center px-6 py-8">
            <div className="text-xs tracking-[.25em] text-white/70 uppercase">Rotary Day</div>
            <h2 className="text-3xl font-black mt-2">{data.ticketTitle}</h2>
          </div>
          <div className="p-7 text-center">
            <div className="text-2xl font-black text-slate-900">{data.name}</div>
            <div className="mt-2 text-xs font-mono text-slate-400">{data.ticketId}</div>
            <img src={qrUrl} className="w-full max-w-[310px] aspect-square mx-auto mt-6 rounded-2xl border-8 border-white shadow-lg" alt="入場 QR Code" />
            <div className="mt-5 text-sm font-bold text-slate-600">活動當日請出示此 QR Code 供接待人員掃描</div>
            {(data.eventDate || data.eventTime || data.eventLocation) && <div className="mt-6 bg-slate-50 rounded-2xl p-4 text-sm text-left space-y-1">
              {data.eventDate && <div><b>日期：</b>{data.eventDate} {data.eventTime}</div>}
              {data.eventLocation && <div><b>地點：</b>{data.eventLocation}</div>}
            </div>}
            {data.isCheckedIn && <div className="mt-5 bg-emerald-50 text-emerald-700 rounded-xl p-3 font-black">✓ 已完成入場報到</div>}
          </div>
        </div>
      </Shell>;
    }

    function Auth({config, onAuthed}) {
      const [mode, setMode] = useState("login");
      const [step, setStep] = useState("form");
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState("");
      const [masked, setMasked] = useState("");
      const [phoneStatus, setPhoneStatus] = useState(null); // null | checking | registered | new | error
      const [form, setForm] = useState({phone:(()=>{try{return localStorage.getItem(LAST_PHONE_KEY)||""}catch(e){return ""}})(), name:"", title:"先生", email:"", code:""});
      const set = (k,v) => setForm(f=>({...f,[k]:v}));
      const phoneValid = /^09\d{8}$/.test(form.phone);

      const setPhone = (v) => {
        const cleaned = String(v || "").replace(/\D/g,"").slice(0,10);
        set("phone", cleaned);
        setPhoneStatus(null);
        setError("");
      };

      // v1.1.4：手機輸入滿 10 碼後，自動查後端是否已註冊，不必先按任何按鈕。
      useEffect(() => {
        if (!phoneValid || step !== "form") {
          setPhoneStatus(null);
          return;
        }
        let cancelled = false;
        const timer = setTimeout(async () => {
          setPhoneStatus("checking");
          try {
            const r = await apiWithRetry("check_phone", {phone: form.phone}, 1);
            if (cancelled) return;
            setPhoneStatus(r.registered ? "registered" : "new");
            // 若是已註冊號碼而目前在「第一次建立帳號」，自動切回登入，避免老人家重複註冊。
            if (r.registered && mode === "register") setMode("login");
          } catch(e) {
            if (!cancelled) setPhoneStatus("error");
          }
        }, 350);
        return () => { cancelled = true; clearTimeout(timer); };
      }, [form.phone, phoneValid, step, mode]);

      async function sendCode() {
        setError("");
        if (!phoneValid) {
          setError("手機號碼必須填滿 10 碼數字，並以 09 開頭，例如：0912345678");
          return;
        }

        // 已知狀態先直接引導，避免多跑一次錯誤流程。
        if (mode === "login" && phoneStatus === "new") {
          setMode("register");
          setError("這支手機尚未建立帳號，請填寫姓名與 Email 建立帳號。");
          return;
        }
        if (mode === "register" && phoneStatus === "registered") {
          setMode("login");
          setError("這支手機已經註冊過，不需要重新建立帳號。");
          return;
        }

        setLoading(true);
        try {
          let r;
          if (mode === "register") {
            r = await api("start_register", {phone:form.phone,name:form.name,title:form.title,email:form.email});
            if (r.status === "exists") {
              setPhoneStatus("registered");
              setMode("login");
              throw new Error("這支手機已經註冊過，請使用手機登入。");
            }
          } else {
            r = await api("start_login", {phone:form.phone});
            if (r.status === "not_found") {
              setPhoneStatus("new");
              setMode("register");
              throw new Error("這支手機尚未建立帳號，請先建立帳號。");
            }
          }
          setMasked(r.maskedEmail || "");
          setStep("otp");
        } catch(e) {
          setError(e.message);
        } finally {
          setLoading(false);
        }
      }

      async function verify() {
        setError("");
        setLoading(true);
        try {
          const action = mode === "register" ? "verify_register" : "verify_login";
          const r = await api(action, {phone:form.phone,code:form.code});
          persistUserSession(r.sessionToken, r.user);
          onAuthed(r.user, r.sessionToken);
        } catch(e) {
          setError(e.message);
        } finally {
          setLoading(false);
        }
      }

      const loginReady = phoneValid && phoneStatus !== "new";
      const registerReady = phoneValid && phoneStatus !== "registered";

      return <Shell config={config}>
        {loading && <Loading text={step === "otp" ? "正在驗證..." : "正在寄送驗證碼..."} />}
        <div className="bg-white rounded-3xl shadow-sm border border-slate-100 p-6">
          <div className="flex bg-slate-100 rounded-2xl p-1 mb-6">
            <button
              onClick={()=>{setMode("login");setStep("form");setError("")}}
              className={`flex-1 py-4 rounded-[1.1rem] text-lg sm:text-base font-black ${mode==="login"?"bg-white shadow text-[#5B3F8C]":"text-slate-400"}`}
            >手機登入</button>
            <button
              onClick={()=>{setMode("register");setStep("form");setError("")}}
              className={`flex-1 py-4 rounded-[1.1rem] text-lg sm:text-base font-black ${mode==="register"?"bg-white shadow text-[#5B3F8C]":"text-slate-400"}`}
            >第一次建立帳號</button>
          </div>

          {error && <div className="mb-4"><Notice type="error">{error}</Notice></div>}

          {step === "form" && mode === "login" &&
            <div className="mb-4">
              <Notice>
                <b>已註冊會員：</b>請輸入完整 10 碼手機號碼，系統會立即查詢是否已有帳號。
                同一台手機／同一個瀏覽器完成一次驗證後，會信任此裝置 1 年並自動登入。
              </Notice>
            </div>
          }

          {step === "form" ? <div className="space-y-4">
            <div>
              <label className="text-sm font-bold text-slate-600">手機號碼</label>
              <input
                value={form.phone}
                onChange={e=>setPhone(e.target.value)}
                inputMode="numeric"
                autoComplete="tel"
                maxLength={10}
                placeholder="例如：0912345678"
                className={`mt-1 w-full px-4 py-4 rounded-2xl border outline-none focus:ring-2 text-lg tracking-wide ${
                  form.phone && !phoneValid ? "border-red-300 focus:ring-red-100" :
                  phoneStatus === "registered" ? "border-emerald-300 focus:ring-emerald-100" :
                  phoneStatus === "new" ? "border-amber-300 focus:ring-amber-100" :
                  "border-slate-200 focus:ring-violet-200"
                }`}
              />

              <div className="mt-2 flex items-center justify-between gap-3 text-xs">
                <span className={form.phone && !phoneValid ? "text-red-500 font-bold" : "text-slate-400"}>
                  請輸入 09 開頭的 10 碼手機號碼，例如：0912345678
                </span>
                <span className={`shrink-0 font-mono font-bold ${phoneValid ? "text-emerald-600" : "text-slate-400"}`}>{form.phone.length}/10</span>
              </div>

              {form.phone.length === 10 && !phoneValid &&
                <div className="mt-2 text-sm font-black text-red-500">
                  手機號碼格式不正確，第一、二碼必須是 09。
                </div>
              }

              {phoneValid && phoneStatus === "checking" &&
                <div className="mt-3 rounded-xl bg-slate-50 px-4 py-3 text-sm font-bold text-slate-500">
                  ⏳ 正在查詢這支手機是否已註冊…
                </div>
              }

              {phoneValid && phoneStatus === "registered" &&
                <div className="mt-3 rounded-xl bg-emerald-50 border border-emerald-200 px-4 py-3 text-sm font-black text-emerald-700">
                  ✅ 此手機號碼已註冊，不需要重新建立帳號。
                </div>
              }

              {phoneValid && phoneStatus === "new" &&
                <div className="mt-3 rounded-xl bg-amber-50 border border-amber-200 px-4 py-3 text-sm font-black text-amber-700">
                  尚未找到此手機的帳號，請使用「第一次建立帳號」。
                </div>
              }

              {phoneValid && phoneStatus === "error" &&
                <div className="mt-3 rounded-xl bg-slate-50 px-4 py-3 text-sm font-bold text-slate-500">
                  目前查詢較慢，仍可繼續操作。
                </div>
              }
            </div>

            {mode === "register" && <>
              <div><label className="text-sm font-bold text-slate-600">姓名</label><input value={form.name} onChange={e=>set("name",e.target.value)} className="mt-1 w-full px-4 py-4 rounded-2xl border border-slate-200" /></div>
              <div><label className="text-sm font-bold text-slate-600">稱謂</label><div className="grid grid-cols-2 gap-3 mt-2">{["先生","小姐"].map(t=><button type="button" key={t} onClick={()=>set("title",t)} className={`py-3 rounded-2xl border font-black ${form.title===t?"bg-violet-50 border-violet-300 text-[#5B3F8C]":"border-slate-200 text-slate-500"}`}>{t}</button>)}</div></div>
              <div><label className="text-sm font-bold text-slate-600">Email</label><input value={form.email} onChange={e=>set("email",e.target.value)} inputMode="email" placeholder="收據與入場券將寄到這裡" className="mt-1 w-full px-4 py-4 rounded-2xl border border-slate-200" /></div>
            </>}

            {mode === "login" && phoneStatus === "new" &&
              <button
                type="button"
                onClick={()=>{setMode("register");setError("")}}
                className="w-full py-4 rounded-2xl bg-amber-500 text-white font-black text-lg"
              >
                前往第一次建立帳號
              </button>
            }

            <button
              disabled={loading || (mode==="login" ? !loginReady : !registerReady)}
              onClick={sendCode}
              className={`w-full py-4 rounded-2xl text-white font-black text-lg shadow-lg transition ${
                !loading && (mode==="login" ? loginReady : registerReady)
                  ? "bg-[#5B3F8C] active:scale-[.99]"
                  : "bg-slate-300 cursor-not-allowed shadow-none"
              }`}
            >
              {mode==="register"
                ? "建立帳號並寄驗證碼"
                : phoneStatus === "registered"
                  ? "此手機已註冊｜驗證此裝置一次"
                  : "登入此手機"
              }
            </button>

            {mode === "login" && phoneStatus === "registered" &&
              <div className="text-center text-xs leading-6 text-slate-400">
                若這台裝置先前已完成驗證，系統會自動登入；現在看到此按鈕表示這台瀏覽器目前沒有可用的信任憑證，只需驗證這台裝置一次。
              </div>
            }
          </div> : <div>
            <div className="text-center mb-5">
              <div className="text-xl sm:text-lg font-black">請查看 Email</div>
              <div className="text-base sm:text-sm text-slate-400 mt-1">驗證碼已寄至 {masked}</div>
            </div>
            <input value={form.code} onChange={e=>set("code",e.target.value.replace(/\D/g,"").slice(0,6))} inputMode="numeric" placeholder="6 位數驗證碼" className="w-full text-center tracking-[.35em] text-3xl sm:text-2xl font-black px-4 py-5 rounded-3xl border-2 border-slate-200" />
            <button onClick={verify} className="w-full mt-4 py-5 rounded-3xl bg-[#5B3F8C] text-white font-black text-xl sm:text-lg shadow-lg">確認登入</button>
            <button onClick={()=>setStep("form")} className="w-full mt-3 py-3 text-slate-400 font-bold text-base sm:text-sm">返回修改資料</button>
          </div>}
        </div>
      </Shell>;
    }

    function PaymentModal({order, config, onClose, onDone}) {
      const [form,setForm]=useState({transferDate:today(), amount:String(order.totalAmount||""), last5:order.prefillLast5 || order.payment?.last5 || ""});
      const [loading,setLoading]=useState(false); const [error,setError]=useState("");
      const token=getStoredUserToken();
      async function submit(){
        setLoading(true);setError("");
        try{
          const r=await api("report_payment",{sessionToken:token,orderId:order.orderId,transferDate:form.transferDate,amount:form.amount,last5:form.last5});
          if(r.warning) alert(r.warning); onDone(); onClose();
        }catch(e){setError(e.message)}finally{setLoading(false)}
      }
      return <div className="fixed inset-0 z-40 bg-black/55 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
        {loading&&<Loading text="正在通知執秘..."/>}
        <div className="bg-white w-full max-w-md rounded-t-[2rem] sm:rounded-[2rem] p-5 sm:p-6 max-h-[92vh] overflow-y-auto">
          <div className="flex justify-between items-center"><h3 className="text-2xl sm:text-xl font-black">回報已匯款</h3><button onClick={onClose} className="w-10 h-10 rounded-full bg-slate-100 font-black">×</button></div>
          <div className="mt-4 bg-violet-50 rounded-2xl p-4 text-[15px] sm:text-sm leading-7">
            <div><b>銀行：</b>{config.bankName || "尚未設定"} {config.bankBranch || ""}</div>
            {config.bankCode&&<div><b>銀行代碼：</b>{config.bankCode}</div>}
            <div><b>戶名：</b>{config.bankAccountName || "尚未設定"}</div>
            <div><b>帳號：</b>{config.bankAccount || "尚未設定"}</div>
            <div><b>本訂單應付：</b>{money(order.totalAmount)}</div>
          </div>
          <div className="mt-4"><Notice>這一步只會通知執秘核帳，<b>不會產生 QR Code</b>。只有執秘確認實際收到款項後，才會寄送收據與入場券。</Notice></div>
          {error&&<div className="mt-4"><Notice type="error">{error}</Notice></div>}
          <div className="space-y-5 mt-5">
            <div><label className="text-sm font-bold text-slate-600">匯款日期</label><input type="date" value={form.transferDate} onChange={e=>setForm({...form,transferDate:e.target.value})} className="w-full mt-1 p-4 rounded-2xl border-2"/></div>
            <div><label className="text-sm font-bold text-slate-600">實際匯款金額</label><input inputMode="numeric" value={form.amount} onChange={e=>setForm({...form,amount:e.target.value.replace(/[^0-9]/g,"")})} className="w-full mt-1 p-4 rounded-2xl border-2 text-xl font-black"/></div>
            <div><label className="text-sm font-bold text-slate-600">匯款帳號後五碼</label><input inputMode="numeric" maxLength="5" value={form.last5} onChange={e=>setForm({...form,last5:e.target.value.replace(/\D/g,"").slice(0,5)})} placeholder="例如 12345" className="w-full mt-1 p-4 rounded-2xl border-2 text-2xl font-black tracking-widest"/></div>
            <button onClick={submit} className="w-full py-5 bg-amber-500 text-white rounded-3xl font-black text-xl sm:text-lg shadow-lg">我已匯款，通知執秘確認</button>
          </div>
        </div>
      </div>;
    }

    function BuyerDashboard({config,user,onLogout}) {
      const ordersCacheKey = ORDERS_CACHE_PREFIX + user.userId;
      const [orders,setOrders]=useState(()=>readJson(ordersCacheKey, [])); const [qty,setQty]=useState(1);
      const [receiptTitle,setReceiptTitle]=useState(`${user.name}${user.title}`);
      const [identity,setIdentity]=useState(""); const [club,setClub]=useState(""); const [last5,setLast5]=useState("");
      const [paymentOrder,setPaymentOrder]=useState(null); const [loading,setLoading]=useState(false); const [error,setError]=useState("");
      const token=getStoredUserToken();
      const total=qty*Number(config.ticketPrice||0);
      async function refresh(){
        setError("");
        try{
          const r=await apiWithRetry("list_my_orders",{sessionToken:token},1);
          const next=r.data||[];
          setOrders(next); writeJson(ordersCacheKey,next);
        }catch(e){setError("目前連線較慢，已保留上次資料。請稍後按「更新」即可。")}
      }
      useEffect(()=>{refresh()},[]);
      async function createOrder(){
        setLoading(true);setError("");
        try{
          await api("create_order",{sessionToken:token,quantity:qty,receiptTitle,identity,club,last5});
          await refresh(); setQty(1);
        }catch(e){setError(e.message)}finally{setLoading(false)}
      }
      return <Shell config={config}>
        {loading&&<Loading text="正在建立訂單..."/>}
        {paymentOrder&&<PaymentModal order={paymentOrder} config={config} onClose={()=>setPaymentOrder(null)} onDone={refresh}/>} 
        <div className="flex justify-between items-center mb-5"><div><div className="text-sm text-slate-400">歡迎回來</div><div className="font-black text-2xl sm:text-lg">{user.name}{user.title}</div></div><button onClick={onLogout} className="px-4 py-3 rounded-2xl border bg-white text-base sm:text-sm font-bold text-slate-500">登出</button></div>
        {error&&<div className="mb-4"><Notice type="error">{error}</Notice></div>}
        {(config.eventDate||config.eventTime||config.eventLocation) && <div className="mb-4 bg-white rounded-[1.5rem] p-5 border text-[15px] sm:text-sm leading-7 soft-card"><b>活動資訊</b><br/>{config.eventDate} {config.eventTime}<br/>{config.eventLocation}</div>}
        {!config.salesOpen && <div className="mb-4"><Notice type="warn">目前暫停開放新的購票訂單；既有訂單仍可查詢。</Notice></div>}

        <section className="bg-white rounded-[2rem] border border-violet-100 p-5 sm:p-6 soft-card shadow-sm">
          <div className="font-black text-[#5B3F8C] text-xl sm:text-base">購買扶輪日票券</div>
          <div className="mt-1 text-sm sm:text-xs text-slate-400">每張 {money(config.ticketPrice)}</div>
          <div className="mt-5"><label className="text-sm sm:text-xs font-bold text-slate-600">身分</label><div className="grid grid-cols-3 gap-2 mt-2">{["扶輪社友／寶眷","貴賓","其他"].map(v=><button type="button" key={v} onClick={()=>setIdentity(v)} className={`py-4 rounded-2xl border text-sm sm:text-xs font-black ${identity===v?"bg-violet-50 border-violet-300 text-[#5B3F8C]":"border-slate-200 text-slate-500"}`}>{v}</button>)}</div></div>
          {identity==="扶輪社友／寶眷"&&<div className="mt-4"><label className="text-sm sm:text-xs font-bold text-slate-600">所屬扶輪社</label><input value={club} onChange={e=>setClub(e.target.value)} placeholder="例如：臺中惠民扶輪社" className="w-full mt-1 p-4 rounded-2xl border-2 border-slate-200"/></div>}
          <div className="flex items-center justify-between mt-5 bg-slate-50 rounded-[1.6rem] p-4">
            <button onClick={()=>setQty(q=>Math.max(1,q-1))} className="w-16 h-16 rounded-2xl bg-white shadow font-black text-3xl">−</button>
            <div className="text-center"><div className="text-4xl sm:text-3xl font-black">{qty}</div><div className="text-xs text-slate-400">張票券</div></div>
            <button onClick={()=>setQty(q=>Math.min(config.maxTicketsPerOrder||20,q+1))} className="w-16 h-16 rounded-2xl bg-white shadow font-black text-3xl">＋</button>
          </div>
          <div className="mt-4"><label className="text-sm sm:text-xs font-bold text-slate-600">收據抬頭</label><input value={receiptTitle} onChange={e=>setReceiptTitle(e.target.value)} className="w-full mt-1 p-4 rounded-2xl border-2 border-slate-200"/></div>
          <div className="mt-4"><label className="text-sm sm:text-xs font-bold text-slate-600">匯款帳號後五碼 <span className="text-slate-300">（可先填，尚未匯款可留白）</span></label><input inputMode="numeric" maxLength="5" value={last5} onChange={e=>setLast5(e.target.value.replace(/\D/g,"").slice(0,5))} placeholder="完成轉帳後可直接填寫" className="w-full mt-1 p-4 rounded-2xl border-2 border-slate-200 tracking-[.28em] font-bold text-lg"/></div>
          <div className="flex justify-between items-end mt-6 bg-violet-50 rounded-[1.5rem] p-4"><div className="text-base sm:text-sm text-slate-500">應付總額</div><div className="text-3xl sm:text-2xl font-black text-[#5B3F8C]">{money(total)}</div></div>
          <button onClick={createOrder} disabled={!config.ticketPrice||!config.salesOpen} className="w-full mt-5 py-5 rounded-3xl bg-[#5B3F8C] disabled:bg-slate-300 text-white font-black text-xl sm:text-lg shadow-lg">建立購票訂單</button>
        </section>

        <section className="mt-6">
          <div className="flex items-center justify-between mb-3"><h2 className="font-black text-2xl sm:text-lg">我的訂單</h2><button onClick={refresh} className="px-4 py-2 rounded-2xl bg-white border text-base sm:text-xs font-bold text-[#5B3F8C]">更新</button></div>
          {!orders.length ? <div className="bg-white rounded-[1.6rem] p-7 text-center text-slate-400 text-base sm:text-sm soft-card">目前沒有訂單</div> : <div className="space-y-4">
            {orders.map(o=>{ const sm=statusMap[o.status]||[o.status,"bg-slate-100"]; return <div key={o.orderId} className="bg-white rounded-[1.8rem] border border-slate-100 p-5 soft-card shadow-sm">
              <div className="flex justify-between gap-3"><div><div className="font-mono text-xs text-slate-400">{o.orderId}</div><div className="font-black mt-1">{o.quantity} 張 · {money(o.totalAmount)}</div><div className="text-sm sm:text-xs text-slate-400 mt-1">{o.identity}{o.club?` · ${o.club}`:""}</div></div><span className={`h-fit text-[11px] font-black px-3 py-1.5 rounded-full ${sm[1]}`}>{sm[0]}</span></div>
              <div className="text-sm text-slate-400 mt-2 leading-6">建立：{o.createdAt}</div>
              {o.status === "WAITING_PAYMENT" && <div className="mt-4">
                {o.note&&<div className="mb-3"><Notice type="warn">{o.note}</Notice></div>}
                <div className="bg-violet-50 rounded-2xl p-4 text-sm leading-7"><div><b>銀行：</b>{config.bankName || "尚未設定"} {config.bankBranch||""}</div>{config.bankCode&&<div><b>銀行代碼：</b>{config.bankCode}</div>}<div><b>戶名：</b>{config.bankAccountName || "尚未設定"}</div><div><b>帳號：</b>{config.bankAccount || "尚未設定"}</div></div>
                <button onClick={()=>setPaymentOrder(o)} className="w-full mt-4 py-4 rounded-2xl bg-amber-500 text-white font-black text-lg shadow">我已匯款</button>
              </div>}
              {o.status === "PAYMENT_REPORTED" && <div className="mt-4"><Notice>已通知執秘核帳。確認實際入帳前，系統不會產生 QR Code。</Notice></div>}
              {o.status === "PAYMENT_ISSUE" && <div className="mt-4"><Notice type="error">{o.note || "付款資料需要再確認，請依主辦單位通知處理。"}</Notice></div>}
              {o.status === "PAID" && <div className="mt-4">{o.receiptId&&<div className="text-xs text-emerald-700 font-bold mb-3">電子收據：{o.receiptId}</div>}<div className="grid gap-2">{(o.tickets||[]).map(t=><a key={t.ticketId} href={t.url} target="_blank" rel="noreferrer" className="flex items-center justify-between p-3 rounded-2xl bg-violet-50 border border-violet-100"><div><div className="font-black text-[#5B3F8C] text-xl sm:text-base">{t.name}</div><div className="text-[10px] font-mono text-slate-400">{t.ticketId}</div></div><span className="text-[#5B3F8C] font-black">開啟票券 ›</span></a>)}</div></div>}
            </div>})}
          </div>}
        </section>
        <div className="mt-8 text-center"><a href="?admin=1" className="text-xs text-slate-300">執秘管理入口</a></div>
      </Shell>;
    }

    function AdminSettings({token,onSaved}) {
      const [form,setForm]=useState(null); const [loading,setLoading]=useState(true); const [error,setError]=useState("");
      useEffect(()=>{api("admin_get_settings",{adminToken:token}).then(r=>setForm({...r.data,newAdminPassword:""})).catch(e=>setError(e.message)).finally(()=>setLoading(false))},[token]);
      const set=(k,v)=>setForm(f=>({...f,[k]:v}));
      async function save(){setLoading(true);setError("");try{const r=await api("admin_save_settings",{adminToken:token,...form});setForm({...r.data,newAdminPassword:""});alert("✅ 設定已儲存");onSaved?.()}catch(e){setError(e.message)}finally{setLoading(false)}}
      if(!form)return <div>{loading&&<Loading text="載入系統設定..."/>}{error&&<Notice type="error">{error}</Notice>}</div>;
      const field=(label,key,opts={})=><div><label className="text-sm sm:text-xs font-bold text-slate-600">{label}</label><input type={opts.type||"text"} value={form[key]??""} onChange={e=>set(key,e.target.value)} placeholder={opts.placeholder||""} className="w-full mt-1 p-4 rounded-2xl border-2 border-slate-200"/></div>;
      return <div className="bg-white rounded-3xl border p-5 shadow-sm">
        {loading&&<Loading text="正在儲存設定..."/>}{error&&<div className="mb-4"><Notice type="error">{error}</Notice></div>}
        <div className="flex items-center justify-between"><div><h3 className="text-xl font-black">活動／售票設定</h3><p className="text-sm sm:text-xs text-slate-400 mt-1">修改後購票首頁會直接使用新設定，不需要改程式。</p></div><label className="flex items-center gap-2 text-sm font-bold"><input type="checkbox" checked={!!form.salesOpen} onChange={e=>set("salesOpen",e.target.checked)}/> 開放售票</label></div>
        <div className="grid sm:grid-cols-2 gap-4 mt-5">
          {field("活動名稱","eventName")}{field("票券標題","ticketTitle")}{field("每張票價","ticketPrice",{type:"number"})}{field("單筆最多張數","maxTicketsPerOrder",{type:"number"})}
          {field("活動日期","eventDate")}{field("活動時間","eventTime")}
          <div className="sm:col-span-2">{field("活動地點","eventLocation")}</div>
        </div>
        <h4 className="font-black mt-7 mb-3 text-[#5B3F8C]">匯款資訊</h4>
        <div className="grid sm:grid-cols-2 gap-4">{field("銀行","bankName")}{field("銀行代碼","bankCode")}{field("分行","bankBranch")}{field("戶名","bankAccountName")}<div className="sm:col-span-2">{field("匯款帳號","bankAccount")}</div></div>
        <h4 className="font-black mt-7 mb-3 text-[#5B3F8C]">通知與系統</h4>
        <div className="grid sm:grid-cols-2 gap-4">{field("執秘 Email","secretaryEmail",{type:"email"})}{field("其他通知 Email","notifyEmails",{placeholder:"多筆可用逗號分隔"})}<div className="sm:col-span-2">{field("前端網址","frontendUrl")}</div>{field("收據編號前綴","receiptPrefix")}{field("寄件顯示名稱","mailSenderName")}<div className="sm:col-span-2">{field("更換管理密碼（不修改請留白）","newAdminPassword",{type:"password"})}</div></div>
        <button onClick={save} className="w-full mt-6 py-4 rounded-2xl bg-[#5B3F8C] text-white font-black text-lg">儲存全部設定</button>
      </div>;
    }

    function Admin({config,onConfigChanged}) {
      const [token,setToken]=useState(localStorage.getItem(ADMIN_TOKEN_KEY)||""); const [password,setPassword]=useState("");
      const [pending,setPending]=useState([]); const [orders,setOrders]=useState([]); const [tab,setTab]=useState("pending");
      const [loading,setLoading]=useState(false); const [error,setError]=useState("");
      async function verifyToken(t=token){if(!t)return false;try{await apiWithRetry("admin_session",{adminToken:t},1);return true}catch(e){if(isSessionInvalidError(e.message)){localStorage.removeItem(ADMIN_TOKEN_KEY);setToken("");}return false}}
      async function loadPending(t=token){const r=await apiWithRetry("admin_pending_payments",{adminToken:t},1);setPending(r.data||[])}
      async function loadOrders(t=token){const r=await apiWithRetry("admin_list_orders",{adminToken:t},1);setOrders(r.data||[])}
      async function load(t=token){setLoading(true);setError("");try{await Promise.all([loadPending(t),loadOrders(t)])}catch(e){setError(e.message)}finally{setLoading(false)}}
      useEffect(()=>{if(token)verifyToken(token).then(ok=>ok&&load(token))},[]);
      async function login(){setLoading(true);setError("");try{const r=await api("admin_login",{password});localStorage.setItem(ADMIN_TOKEN_KEY,r.adminToken);setToken(r.adminToken);await load(r.adminToken)}catch(e){setError(e.message)}finally{setLoading(false)}}
      async function confirm(o){if(!window.confirm(`確認銀行已收到 ${money(o.totalAmount)}，並正式產生 ${o.quantity} 張 QR 入場券？`))return;setLoading(true);setError("");try{const r=await api("admin_confirm_payment",{adminToken:token,orderId:o.orderId});alert(r.warnings?.length?"已完成出票，但：\n"+r.warnings.join("\n"):"✅ 已確認入帳，收據與票券已寄出");await load(token)}catch(e){setError(e.message)}finally{setLoading(false)}}
      async function notReceived(o){if(!window.confirm(`確定目前查不到 ${o.buyerName}${o.title} 的款項？\n\n系統會把訂單退回「等待匯款」，並寄信請對方完成匯款後重新按「我已匯款」。`))return;setLoading(true);setError("");try{const r=await api("admin_payment_not_received",{adminToken:token,orderId:o.orderId});alert("✅ "+r.message+(r.warning?"\n"+r.warning:""));await load(token)}catch(e){setError(e.message)}finally{setLoading(false)}}
      async function markIssue(o){const note=window.prompt("請輸入需要對方確認的原因，例如：應收 4,400 元，但目前只查到 2,200 元。", "匯款資料需要進一步確認");if(note===null)return;setLoading(true);setError("");try{await api("admin_mark_payment_issue",{adminToken:token,orderId:o.orderId,note});alert("已標記為資料需確認並通知購買人");await load(token)}catch(e){setError(e.message)}finally{setLoading(false)}}
      async function resend(o){if(!window.confirm(`重新寄送 ${o.orderId} 的收據與全部票券？`))return;setLoading(true);try{const r=await api("admin_resend_order_email",{adminToken:token,orderId:o.orderId});alert("✅ "+r.message)}catch(e){setError(e.message)}finally{setLoading(false)}}
      function logout(){localStorage.removeItem(ADMIN_TOKEN_KEY);setToken("");setPassword("")}

      return <Shell config={config}>
        {loading&&<Loading text="執秘資料處理中..."/>}
        <div className="mb-4 flex justify-between items-center"><a href="./" className="text-sm font-bold text-[#5B3F8C]">← 返回購票首頁</a>{token&&<button onClick={logout} className="text-xs font-bold text-slate-400">管理端登出</button>}</div>
        {!token ? <div className="bg-white p-5 sm:p-6 rounded-[2rem] border shadow-sm max-w-md mx-auto soft-card"><h2 className="text-2xl font-black">執秘管理端</h2><p className="text-base sm:text-sm text-slate-400 mt-1">核對實際入帳後，才能建立 QR Code 入場券。</p>{error&&<div className="mt-4"><Notice type="error">{error}</Notice></div>}<input type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="管理密碼" className="w-full mt-5 p-4 rounded-3xl border-2"/><button onClick={login} className="w-full mt-4 py-5 rounded-3xl bg-[#5B3F8C] text-white font-black text-xl sm:text-lg shadow-lg">登入管理端</button></div> : <>
          <div className="grid grid-cols-3 gap-2 mb-5 bg-white rounded-[1.4rem] p-1 border soft-card">{[["pending","待核帳"],["orders","全部訂單"],["settings","活動設定"]].map(([k,l])=><button key={k} onClick={()=>setTab(k)} className={`py-4 rounded-[1rem] text-base sm:text-sm font-black ${tab===k?"bg-[#5B3F8C] text-white":"text-slate-400"}`}>{l}{k==="pending"&&pending.length?` (${pending.length})`:""}</button>)}</div>
          {error&&<div className="mb-4"><Notice type="error">{error}</Notice></div>}
          {tab==="pending"&&<><div className="flex justify-between items-center mb-4"><div><h2 className="text-2xl font-black">待核帳款項</h2><p className="text-xs text-slate-400">購買人已按「我已匯款」，但尚未出票</p></div><button onClick={()=>load(token)} className="px-4 py-3 bg-white rounded-2xl border text-base sm:text-xs font-bold">更新</button></div>
            {!pending.length?<div className="bg-white rounded-[1.8rem] p-8 text-center text-slate-400 soft-card">目前沒有待核帳資料</div>:<div className="space-y-4">{pending.map(o=><div key={o.orderId} className="bg-white rounded-[1.8rem] p-5 border shadow-sm soft-card">
              <div className="flex justify-between"><div><div className="font-black text-xl sm:text-lg">{o.buyerName}{o.title}</div><div className="text-xs font-mono text-slate-400">{o.orderId}</div><div className="text-sm sm:text-xs text-slate-400 mt-1">{o.identity}{o.club?` · ${o.club}`:""}</div></div><div className="text-right"><div className="text-xs text-slate-400">應收</div><div className="text-xl font-black text-[#5B3F8C]">{money(o.totalAmount)}</div></div></div>
              <div className="grid grid-cols-2 gap-3 mt-4 text-[15px] sm:text-sm"><div className="bg-slate-50 rounded-xl p-3"><div className="text-xs text-slate-400">張數</div><b>{o.quantity} 張</b></div><div className={`rounded-xl p-3 ${Number(o.transferAmount)===Number(o.totalAmount)?"bg-emerald-50":"bg-rose-50"}`}><div className="text-xs text-slate-400">回報金額</div><b>{money(o.transferAmount)}</b></div><div className="bg-slate-50 rounded-xl p-3"><div className="text-xs text-slate-400">匯款日期</div><b>{o.transferDate}</b></div><div className="bg-amber-50 rounded-xl p-3"><div className="text-xs text-slate-400">帳號末五碼</div><b className="text-lg tracking-widest">{o.last5}</b></div></div>
              <div className="mt-3 text-xs text-slate-400">{o.phone} · {o.email}</div>
              {o.note&&<div className="mt-3"><Notice type="warn">{o.note}</Notice></div>}
              <button onClick={()=>confirm(o)} className="w-full mt-4 py-5 rounded-3xl bg-emerald-600 text-white font-black text-xl sm:text-lg shadow-lg">✓ 已收到款項・確認出票</button>
              <div className="grid grid-cols-2 gap-2 mt-2"><button onClick={()=>notReceived(o)} className="py-4 rounded-2xl bg-rose-50 text-rose-700 border border-rose-200 font-black text-base sm:text-sm">目前查無款項</button><button onClick={()=>markIssue(o)} className="py-4 rounded-2xl bg-amber-50 text-amber-800 border border-amber-200 font-black text-base sm:text-sm">資料有疑問</button></div>
            </div>)}</div>}
          </>}
          {tab==="orders"&&<div><div className="flex justify-between items-center mb-4"><div><h2 className="text-2xl font-black">全部訂單</h2><p className="text-xs text-slate-400">顯示最近 300 筆</p></div><button onClick={()=>loadOrders(token)} className="px-4 py-3 bg-white rounded-2xl border text-base sm:text-xs font-bold">更新</button></div><div className="space-y-3">{orders.map(o=>{const sm=statusMap[o.status]||[o.status,"bg-slate-100"];return <div key={o.orderId} className="bg-white rounded-[1.4rem] p-4 border soft-card"><div className="flex justify-between gap-2"><div><div className="font-black">{o.buyerName}{o.title}</div><div className="text-[10px] font-mono text-slate-400">{o.orderId}</div><div className="text-sm sm:text-xs text-slate-400 mt-1">{o.quantity} 張 · {money(o.totalAmount)} · {o.identity}{o.club?` · ${o.club}`:""}</div></div><span className={`h-fit text-xs font-black px-3 py-1.5 rounded-full ${sm[1]}`}>{sm[0]}</span></div>{o.note&&<div className="text-xs text-rose-600 mt-2">{o.note}</div>}{o.status==="PAID"&&<button onClick={()=>resend(o)} className="mt-3 px-3 py-2 rounded-xl bg-violet-50 text-[#5B3F8C] font-black text-xs">重新寄送收據＋票券</button>}</div>})}</div></div>}
          {tab==="settings"&&<AdminSettings token={token} onSaved={onConfigChanged}/>} 
        </>}
      </Shell>;
    }

    function App(){
      const params=new URLSearchParams(location.search);
      const ticketId=params.get("ticket");
      const ticketToken=params.get("k");
      const adminMode=params.get("admin")==="1";

      const storedToken = getStoredUserToken();
      const cachedUser = storedToken ? readJson(USER_PROFILE_CACHE_KEY, null) : null;
      const cachedConfig = readJson(CONFIG_CACHE_KEY, null);

      const [config,setConfig]=useState(cachedConfig);
      const [user,setUser]=useState(cachedUser);
      const [checking,setChecking]=useState(!cachedUser && !ticketId && !adminMode);

      async function refreshConfig(){
        try{
          const r=await apiWithRetry("get_config",{},1);
          setConfig(r.data); writeJson(CONFIG_CACHE_KEY,r.data);
        }catch(e){
          if(!config) setConfig({eventName:"臺中惠民扶輪社 扶輪日",ticketTitle:"扶輪日入場券",ticketPrice:0,maxTicketsPerOrder:20,salesOpen:true});
        }
      }

      useEffect(()=>{refreshConfig()},[]);
      useEffect(()=>{
        if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
      },[]);

      useEffect(()=>{
        if(ticketId||adminMode){setChecking(false);return;}
        const t=getStoredUserToken();
        if(!t){setUser(null);setChecking(false);return;}

        // 同一支手機／同一瀏覽器會保留登入。短暫網路錯誤不再刪除登入憑證。
        apiWithRetry("session_me",{sessionToken:t},2)
          .then(r=>{
            setUser(r.user);
            persistUserSession(t, r.user);
          })
          .catch(e=>{
            if(isSessionInvalidError(e.message)){
              clearUserSession();
              setUser(null);
            }
            // 非登入失效（例如 GAS 冷啟動、網路暫斷）時保留原登入，不要求重新收驗證碼。
          })
          .finally(()=>setChecking(false));
      },[]);

      if(ticketId&&ticketToken)return <TicketPublic ticketId={ticketId} token={ticketToken} config={config}/>;
      if(adminMode)return <Admin config={config} onConfigChanged={refreshConfig}/>;
      if(checking||!config)return <Loading text={storedToken ? "正在辨識這台已信任裝置..." : "資料載入中..."}/>;
      if(!user)return <Auth config={config} onAuthed={(u, token)=>{
        setUser(u);
        persistUserSession(token || getStoredUserToken(), u);
      }}/>;
      return <BuyerDashboard config={config} user={user} onLogout={()=>{
        const t=getStoredUserToken();
        api("logout",{sessionToken:t}).catch(()=>{});
        clearUserSession();
        localStorage.removeItem(ORDERS_CACHE_PREFIX + user.userId);
        setUser(null);
      }}/>;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
